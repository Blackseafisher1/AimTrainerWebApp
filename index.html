<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
      <link rel="stylesheet" href="style.css">

  
  <title>Aim Trainer</title>

</head>
<body>
<span id="NAME">by Ege             |             @KARADENIZ,
                                                     EGE™ </span>
<div id="header">
  <button id="fullscreen-btn" aria-label="Toggle big play area" title="Big play area">
    <svg id="icon-expand" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
    <svg id="icon-compress" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
      <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
      <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
      <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
    </svg>
  </button>
  <h1 data-text="Aim Trainer">Aim Trainer</h1>
</div>

<div id="game-area"></div>

<div id="controls">
  <button id="size-btn">Change Target Size</button>
  <button id="mode-btn">Switch Mode</button>
  <button id="stop-btn">Stop Round</button>

  <div id="sound-controls">
    <div>
      <h3>Sound Settings / Target Apperance</h3>
      <div id="sound-upload-container">
        <div class="sound-selector">
          <button class="sound-option" data-sound="classic">Classic</button>
          <button class="sound-option" data-sound="beep">Beep</button>
          <button class="sound-option" data-sound="pop">Pop</button>
          <button class="sound-option" data-sound="laser">Laser</button>
          <button class="sound-option" data-sound="custom">Custom</button>
        </div>
        <label for="soundUploadBtn"  class="miniButton"> 
       <input type="file" id="soundUploadBtn" accept="audio/*" style="display: none;">
        Upload custom sound (>1sek)
        </label>  
        <span id="file-name">No sound uploaded</span>
        <button id="reset-sound" class="miniButton" >Reset Sound</button>

        <button id="toggle-target" class="miniButton">Switch to Image</button>
      
      </div>
    </div>
  
    <div id="volumeHiteffect">
      <h3>Volume Control</h3>
      <input type="range" id="sound-volume" min="0" max="1" step="0.1" value="0.5">
      <div id="volume-value">50%</div>
      <div id="sound-status" class="active">Sound: ON</div>
      <h3 class="hit-effects-title">Hit Effects</h3>
     <button id="toggle-hit-effect" class="miniButton">
      Switch to Pulse
    </button>
    <button id ="hitEffectOnOff" class="miniButton">
      Turn hiteffects OFF
    </button>
    </div>
  </div>
  
  <div id="info">
    <div class="info-item" id="time-item">
      Time Left: <span id="time">60</span>
    </div>
    <div class="info-item">
      Score: <span id="score">0</span>
    </div>
    <div class="info-item">
      Missclicks: <span id="missclicks">0</span>
    </div>
    <div class="info-item" id="best-score">
       <span id="best-score-value">0</span>
    </div>
    <div class="info-item">
      Mode: <span id="mode-display" >Single</span>
    </div>
    <div class="info-item">
      Accuracy: <span id="accuracy">0%</span>
    </div>
    <div class="info-item">
      Combo: <span id="combo">0</span>
    </div>
    <div class="info-item">
      Avg Time: <span id="avg-time">0.00s</span>
    </div>
  </div> 
</div>

<script src="main.js"> </script>
</body>
</html>
